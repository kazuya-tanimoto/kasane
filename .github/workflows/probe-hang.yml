# 起動したあとに画面の描き直しが止まらなくなる不具合を、版ごとに測る（2026-11-05、一時的な枝）
name: Probe launch hang
on:
  push:
jobs:
  probe:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        ref: [4ff40cb17b6ac49e187bb123d17b424e90ca339b,c2ee764b56f847d0465487e276a3664d4ff4a464,52be6adacfcbd73f83ae5e3ebb2ad2225596f23c,d7990c96125add458c86a143fb85d68d5521de02]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: build
        run: scripts/build-app.sh
      - name: launch and measure
        run: |
          defaults write io.github.kazuya-tanimoto.kasane hasCompletedOnboarding -bool true
          open build/Kasane.app
          sleep 20
          echo "== ref ${{ matrix.ref }}"
          ps -axo pid,%cpu,comm | grep -i kasane | grep -v grep || echo "not running"
          sleep 10
          ps -axo pid,%cpu,comm | grep -i kasane | grep -v grep || echo "not running"
          sample Kasane 3 2>/dev/null | sed -n '/Call graph:/,$p' | head -40 || true
