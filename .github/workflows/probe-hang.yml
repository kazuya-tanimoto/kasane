# 起動したあとに画面の描き直しが止まらなくなる不具合を、版ごとに測る（2026-11-05、一時的な枝）
name: Probe launch hang
on:
  push:
jobs:
  probe:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        ref: [9fe00290f6cc85a7c75e9f65246513094702145b,88f464f33b3641444e8bf97607365f006c9c575a,c2ee764b56f847d0465487e276a3664d4ff4a464,ec7f1db0cdf35f2e5481c94fb3a8a926dc1636b4,f8b975b7a41f87e929ba82a57d056ae17aa275a6,e4298321645c5d5efb2b7f70682ff1d3a2bbc9fa,c2e6e3e5b4e7cb174dd26b52af517059936d9838,ae0aabd4a01b73cd8b706cdaabebf66a3d850ba7]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: build
        run: scripts/build-app.sh
      - name: launch and measure
        run: |
          defaults write io.github.kazuya-tanimoto.kasane hasCompletedOnboarding -bool true
          open build/Kasane.app
          sleep 20
          echo "== ref ${{ matrix.ref }}"
          ps -axo pid,%cpu,comm | grep -i kasane | grep -v grep || echo "not running"
          sleep 10
          ps -axo pid,%cpu,comm | grep -i kasane | grep -v grep || echo "not running"
          sample Kasane 3 2>/dev/null | sed -n '/Call graph:/,$p' | head -40 || true
