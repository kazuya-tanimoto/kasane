# 一時的: 設定のタブの高さを測る（測ったらブランチごと消す）
name: settings-probe
on: push
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift build --product Kasane
      - name: 測る
        run: |
          (KASANE_PROBE=1 .build/debug/Kasane > out.txt 2>&1 &) ; sleep 25; grep PROBE out.txt | sort -u | tail -40 | while IFS= read -r l; do echo "::notice::$l"; done
