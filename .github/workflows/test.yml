# 一時的な調べ（probe/history-window-frame）。マージしない
name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: probe
        run: swift scripts/probe-frame.swift probe-out 2>&1 | tee probe-out.log
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            probe-out
            probe-out.log
