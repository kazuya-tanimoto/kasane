# 一時的な調べ（probe/glass-bar-extend）。マージしない
name: Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: build
        run: swift build --product Kasane
      - name: probe
        run: |
          mkdir -p probe-out
          sleep 2
          defaults delete Kasane 2>/dev/null || true; defaults delete io.github.kazuya-tanimoto.kasane 2>/dev/null || true
          perl -e 'alarm 300; exec @ARGV' swift scripts/probe-bar-drag.swift "$(pwd)/.build/debug/Kasane" probe-out 2>&1 | tee probe-out/probe.log || true
      - name: save
        run: |
          git config user.name probe; git config user.email probe@example.com
          git checkout --orphan probe-out-branch
          git rm -rq --cached . ; git add -f probe-out
          git commit -qm "probe output"
          git push -f origin HEAD:probe/glass-bar-extend-out
