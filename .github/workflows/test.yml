# push のたびに、Mac でビルドとテストを流す（2026-10-21 決定。design/regression-tests-2026-10-21.md）。
# クラウドの作業環境では Swift をビルドできないので、壊れた push を Kazuya さんの確認より先に見つけるため
name: Test

on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift の版（記録用）
        run: swift --version
      - name: probe
        run: |
          swift scripts/probe-dock.swift
          defaults write com.apple.dock autohide -bool true
          killall Dock; sleep 5
          echo "--- autohide on"
          swift scripts/probe-dock.swift
          defaults write com.apple.dock orientation -string right
          killall Dock; sleep 5
          echo "--- autohide on, right"
          swift scripts/probe-dock.swift
          defaults write com.apple.dock autohide -bool false
          killall Dock; sleep 5
          echo "--- autohide off, right"
          swift scripts/probe-dock.swift
