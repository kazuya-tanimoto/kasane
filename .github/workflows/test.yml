# 一時的な調べ（probe/history-window-frame）。マージしない
name: Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: probe
        run: |
          mkdir -p probe-out; perl -e 'alarm 240; exec @ARGV' swift scripts/probe-frame.swift probe-out 2>&1 | tee probe-out.log || true
          grep PROBE probe-out.log | while read -r line; do echo "::notice::$line"; done
      - name: save
        run: |
          git config user.name probe; git config user.email probe@example.com
          git checkout --orphan probe/history-window-frame-out
          git rm -rq --cached .
          cp probe-out.log probe-out/
          git add -f probe-out
          git commit -qm "probe output"
          git push -f origin HEAD:probe/history-window-frame-out
