# 一時的な調べ（probe/glass-bar-extend）。マージしない
name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: build
        run: swift build --product Kasane
      - name: probe
        run: |
          mkdir -p probe-out
          defaults delete Kasane 2>/dev/null || true; defaults delete io.github.kazuya-tanimoto.kasane 2>/dev/null || true
          perl -e 'alarm 300; exec @ARGV' swift scripts/probe-bar-drag.swift "$(pwd)/.build/debug/Kasane" probe-out 2>&1 | tee probe-out/probe.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out
