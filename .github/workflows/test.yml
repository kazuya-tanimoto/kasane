# 一時的な調べ（probe/history-window-frame-e2e）。マージしない
name: Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: build
        run: |
          swift build --product Kasane
          git worktree add ../before origin/main
          (cd ../before && swift build --product Kasane)
      - name: probe
        run: |
          mkdir -p probe-out
          # 背景に色の縞の画像を置き、透け方を見やすくする
          python3 -c "
          import struct,zlib
          w,h=1024,768
          rows=b''.join(b'\x00'+b''.join((b'\xff\x00\x00' if (x//3)%2==0 else b'\x00\x00\xff') if (x//6)%2==0 else b'\xff\xff\xff' for x in range(w)) for y in range(h))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          open('/tmp/stripes.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(rows))+chunk(b'IEND',b''))
          " || true
          osascript -e 'tell application "System Events" to tell every desktop to set picture to "/tmp/stripes.png"' || true
          sleep 2
          perl -e 'alarm 300; exec @ARGV' swift scripts/probe-e2e.swift ../before/.build/debug/Kasane before probe-out 0 2>&1 | tee probe-out/before.log || true
          sleep 2
          perl -e 'alarm 300; exec @ARGV' swift scripts/probe-e2e.swift .build/debug/Kasane after probe-out 3 2>&1 | tee probe-out/after.log || true
          grep PROBE probe-out/*.log | while read -r line; do echo "::notice::$line"; done
      - name: save
        if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git checkout --orphan probe-e2e-out
          git rm -rq --cached .
          git add -f probe-out
          git commit -qm "probe output"
          git push -f origin HEAD:probe/history-window-frame-e2e-out
